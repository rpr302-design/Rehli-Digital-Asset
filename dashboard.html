<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>प्रोफाइल और रिवॉर्ड्स - रहली डिजिटल एसेट</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #667eea; --secondary: #764ba2; --gold: #FFD700; }
        body {
            font-family: 'Poppins', sans-serif;
            background: #f0f2f5; margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
        }

        /* प्रोफाइल हेडर */
        .profile-header {
            width: 100%; background: linear-gradient(135deg, var(--primary), var(--secondary));
            padding: 40px 20px; text-align: center; color: white;
            border-radius: 0 0 30px 30px; box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .avatar { width: 80px; height: 80px; background: white; border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 35px; color: var(--secondary); border: 3px solid var(--gold); }

        .container { width: 90%; max-width: 400px; margin-top: -30px; }

        /* कार्ड स्टाइल */
        .card {
            background: white; padding: 20px; border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-bottom: 20px;
        }

        /* चाबी वाला सेक्शन (बीच में) */
        .earn-section {
            background: #fff9e6; border: 2px dashed var(--gold);
            text-align: center; padding: 15px; border-radius: 20px;
        }
        .earn-section h3 { font-size: 16px; margin: 0 0 10px; color: #b8860b; }
        .earn-input { width: 80%; padding: 10px; border: 1px solid #ddd; border-radius: 10px; text-align: center; font-size: 18px; font-weight: 600; margin-bottom: 10px; }
        
        .btn-unlock { background: var(--gold); color: #333; border: none; padding: 10px 20px; border-radius: 10px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .btn-unlock:hover { background: #e6c200; }

        label { display: block; font-size: 12px; color: #666; margin-bottom: 5px; font-weight: 600; }
        input, select { width: 100%; padding: 12px; margin-bottom: 15px; border: 1.5px solid #eee; border-radius: 10px; box-sizing: border-box; }

        .btn-save { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 12px; font-weight: 600; font-size: 16px; cursor: pointer; }

        #customToast { position: fixed; top: 20px; background: #333; color: white; padding: 10px 20px; border-radius: 10px; display: none; z-index: 1000; }
    </style>
</head>
<body>

<div id="customToast"></div>

<div class="profile-header">
    <div class="avatar"><i class="fa-solid fa-user-check"></i></div>
    <h2 id="welcomeName">नमस्ते!</h2>
    <p id="userPhone">---</p>
</div>

<div class="container">
    <!-- 1. प्रोफाइल जानकारी अपडेट -->
    <div class="card">
        <label>आपका नाम (Full Name)</label>
        <input type="text" id="userName" placeholder="अपना नाम लिखें" oninput="this.value = this.value.toUpperCase()">
        
        <label>लिंग (Gender)</label>
        <select id="userGender">
            <option value="">चुनें</option>
            <option value="Male">पुरुष (Male)</option>
            <option value="Female">महिला (Female)</option>
        </select>
        <button class="btn-save" onclick="updateProfile()">प्रोफाइल अपडेट करें</button>
    </div>

    <!-- 2. बीच में चाबी वाला ऑप्शन (Earn More) -->
    <div class="card earn-section">
        <h3><i class="fa-solid fa-key"></i> नया रिवॉर्ड पाएँ</h3>
        <p style="font-size: 11px; color: #888;">दूसरे वीडियो की चाबी यहाँ डालें</p>
        <input type="number" id="extraKey" class="earn-input" placeholder="0 0 0 0 0" oninput="if(this.value.length > 5) this.value = this.value.slice(0, 5);">
        <br>
        <button class="btn-unlock" id="unlockBtn" onclick="earnMore()">एसेट जोड़ें (+ Assets)</button>
    </div>

    <!-- 3. लॉगआउट बटन -->
    <p onclick="logout()" style="text-align: center; color: #888; font-size: 13px; cursor: pointer;">नंबर बदलें या लॉगआउट करें</p>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAuqo9MoZ9lr4STXztO36n0ASqHOytdAeI",
        authDomain: "rehli-digital-asset.firebaseapp.com",
        projectId: "rehli-digital-asset",
        storageBucket: "rehli-digital-asset.firebasestorage.app",
        messagingSenderId: "779415089179",
        appId: "1:779415089179:web:4f6654088af999ed7ac8be"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const mobile = localStorage.getItem('userMobile');

    // सुरक्षा जाँच: अगर अकाउंट नहीं बना है तो चाबी वाले पेज पर भेजें
    if (!mobile) {
        window.location.href = "rewards.html"; // अपने रिवॉर्ड/चाबी वाले पेज का नाम लिखें
    }

    // डेटा लोड करें
    async function loadData() {
        document.getElementById('userPhone').innerText = "+91 " + mobile;
        const userSnap = await getDoc(doc(db, "users", mobile));
        if (userSnap.exists()) {
            const data = userSnap.data();
            if (data.userName) {
                document.getElementById('userName').value = data.userName;
                document.getElementById('welcomeName').innerText = "नमस्ते, " + data.userName;
            }
            if (data.gender) document.getElementById('userGender').value = data.gender;
        }
    }

    // प्रोफाइल अपडेट
    window.updateProfile = async () => {
        const name = document.getElementById('userName').value.trim();
        const gender = document.getElementById('userGender').value;

        if (!name || !gender) {
            showToast("कृपया सभी जानकारी भरें!");
            return;
        }

        await setDoc(doc(db, "users", mobile), {
            userName: name,
            gender: gender
        }, { merge: true });

        showToast("प्रोफाइल सुरक्षित हो गई! ✅");
        setTimeout(() => { window.location.href = "dashboard.html"; }, 1500);
    };

    // बीच वाले चाबी सेक्शन से अर्निंग
    window.earnMore = async () => {
        const key = document.getElementById('extraKey').value;
        const btn = document.getElementById('unlockBtn');

        if (key.length !== 5) {
            showToast("5 अंकों की चाबी डालें!");
            return;
        }

        btn.disabled = true;
        btn.innerText = "जाँच हो रही है...";

        try {
            // 1. चेक करें कि चाबी सही है या नहीं
            const assetSnap = await getDoc(doc(db, "assets", key));
            if (!assetSnap.exists()) {
                showToast("गलत चाबी! ❌");
                btn.disabled = false;
                return;
            }

            // 2. चेक करें कि यूजर ने इसे पहले इस्तेमाल तो नहीं किया (Usage History)
            const usageRef = doc(db, "users", mobile, "used_keys", key);
            const usageSnap = await getDoc(usageRef);
            if (usageSnap.exists()) {
                showToast("आप यह चाबी इस्तेमाल कर चुके हैं!");
                btn.disabled = false;
                return;
            }

            // 3. एसेट जोड़ें
            const winValue = assetSnap.data().value || 0;
            const userRef = doc(db, "users", mobile);
            const userDoc = await getDoc(userRef);
            const currentBalance = userDoc.data().balance || 0;

            await setDoc(userRef, { balance: currentBalance + winValue }, { merge: true });
            await setDoc(usageRef, { timestamp: new Date().toISOString(), value: winValue });

            showToast(`बधाई! +${winValue} एसेट मिले 💰`);
            document.getElementById('extraKey').value = "";
            loadData(); // बैलेंस रिफ्रेश के लिए

        } catch (e) { showToast("एरर: " + e.message); }
        btn.disabled = false;
        btn.innerText = "एसेट जोड़ें (+ Assets)";
    };

    window.showToast = (msg) => {
        const t = document.getElementById('customToast');
        t.innerText = msg;
        t.style.display = "block";
        setTimeout(() => { t.style.display = "none"; }, 3000);
    };

    window.logout = () => {
        localStorage.removeItem('userMobile');
        window.location.href = "rewards.html";
    };

    loadData();
</script>

</body>
</html>
