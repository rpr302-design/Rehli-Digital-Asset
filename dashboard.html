<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>डैशबोर्ड - रहली डिजिटल एसेट</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #4e54c8; --gold: #FFD700; --bg: #f8f9fa; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg); margin: 0; padding-bottom: 80px; }
        
        /* टॉप हेडर */
        .header { background: linear-gradient(to right, #4e54c8, #8f94fb); padding: 20px; color: white; border-radius: 0 0 25px 25px; text-align: center; }
        .balance-card { background: white; color: #333; margin: -30px 20px 20px; padding: 20px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; }
        .balance-card h3 { margin: 0; font-size: 14px; color: #666; }
        .balance-card .amount { font-size: 24px; font-weight: 700; color: var(--primary); }

        .section { padding: 20px; }
        h2 { font-size: 18px; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }

        /* लीडरबोर्ड स्टाइल */
        .leaderboard { background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .user-row { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid #eee; }
        .user-row:last-child { border-bottom: none; }
        .rank { width: 30px; font-weight: 700; color: var(--primary); }
        .user-info { flex-grow: 1; margin-left: 10px; }
        .user-info span { font-size: 14px; font-weight: 600; }
        .user-assets { font-weight: 700; color: #27ae60; }

        /* रेफरल बॉक्स */
        .refer-box { background: #fff; padding: 20px; border-radius: 20px; text-align: center; border: 2px dashed var(--primary); }
        .ref-code { font-size: 20px; letter-spacing: 2px; font-weight: 700; color: var(--primary); margin: 10px 0; }
        .share-btns { display: flex; justify-content: center; gap: 15px; margin-top: 15px; }
        .share-btn { width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; text-decoration: none; font-size: 20px; }
        .whatsapp { background: #25D366; } .fb { background: #1877F2; } .copy { background: #636e72; }

        /* बॉटम नेविगेशन (App Style) */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; justify-content: space-around; padding: 10px 0; box-shadow: 0 -5px 20px rgba(0,0,0,0.1); border-radius: 20px 20px 0 0; }
        .nav-item { text-align: center; color: #aaa; text-decoration: none; flex: 1; }
        .nav-item.active { color: var(--primary); }
        .nav-item i { font-size: 20px; display: block; }
        .nav-item span { font-size: 11px; }
    </style>
</head>
<body>

<div class="header">
    <h2 style="margin:0; justify-content: center;">नमस्ते, <span id="userName">यूजर</span> 👋</h2>
    <p style="font-size: 12px; opacity: 0.8;">रहली डिजिटल एसेट में आपका स्वागत है</p>
</div>

<div class="balance-card">
    <div>
        <h3>आपका एसेट (Asset)</h3>
        <div class="amount"><i class="fa-solid fa-coins" style="color:var(--gold)"></i> <span id="userBalance">0</span></div>
    </div>
    <button onclick="location.href='profile-setup.html'" style="padding: 10px 15px; border-radius: 10px; border: none; background: #e8f0fe; color: var(--primary); font-weight: 600; font-size: 12px;">प्रोफाइल पूर्ण करें</button>
</div>

<div class="section">
    <h2><i class="fa-solid fa-trophy" style="color:var(--gold)"></i> टॉप 10 विनर्स</h2>
    <div class="leaderboard" id="leaderboard">
        <!-- डेटा यहाँ लोड होगा -->
        <p style="padding: 20px; text-align: center;">लोड हो रहा है...</p>
    </div>
</div>

<div class="section">
    <h2><i class="fa-solid fa-share-nodes"></i> दोस्तों को रेफर करें</h2>
    <div class="refer-box">
        <p style="font-size: 13px; color: #666;">हर रेफरल पर पाएँ 50 एसेट</p>
        <div class="ref-code" id="refCode">RD-8085</div>
        <div class="share-btns">
            <a href="#" class="share-btn whatsapp" onclick="shareWhatsApp()"><i class="fa-brands fa-whatsapp"></i></a>
            <a href="#" class="share-btn fb"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="#" class="share-btn copy" onclick="copyRef()"><i class="fa-solid fa-copy"></i></a>
        </div>
    </div>
</div>

<!-- मोबाइल ऐप नेविगेशन -->
<nav class="bottom-nav">
    <a href="#" class="nav-item active"><i class="fa-solid fa-house"></i><span>होम</span></a>
    <a href="mystery-box.html" class="nav-item"><i class="fa-solid fa-box-open"></i><span>मिस्ट्री बॉक्स</span></a>
    <a href="profile-setup.html" class="nav-item"><i class="fa-solid fa-user"></i><span>प्रोफाइल</span></a>
    <a href="#" class="nav-item" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i><span>लॉगआउट</span></a>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAuqo9MoZ9lr4STXztO36n0ASqHOytdAeI",
        authDomain: "rehli-digital-asset.firebaseapp.com",
        projectId: "rehli-digital-asset",
        storageBucket: "rehli-digital-asset.firebasestorage.app",
        messagingSenderId: "779415089179",
        appId: "1:779415089179:web:4f6654088af999ed7ac8be"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const mobile = localStorage.getItem('userMobile');
    if (!mobile) window.location.href = "rewards.html";

    // 1. लोड यूजर डेटा
    async function loadUserData() {
        const userSnap = await getDoc(doc(db, "users", mobile));
        if (userSnap.exists()) {
            const data = userSnap.data();
            document.getElementById('userName').innerText = data.userName || "यूजर";
            document.getElementById('userBalance').innerText = data.balance || 0;
            document.getElementById('refCode').innerText = "RD-" + mobile.slice(-4);
        }
    }

    // 2. लोड लीडरबोर्ड (Top 10)
    async function loadLeaderboard() {
        const q = query(collection(db, "users"), orderBy("balance", "desc"), limit(10));
        const querySnapshot = await getDocs(q);
        const listBody = document.getElementById('leaderboard');
        listBody.innerHTML = "";

        let rank = 1;
        querySnapshot.forEach((doc) => {
            const data = doc.data();
            listBody.innerHTML += `
                <div class="user-row">
                    <div class="rank">${rank}</div>
                    <div class="user-info">
                        <span>${data.userName || "Unknown User"}</span>
                    </div>
                    <div class="user-assets">${data.balance || 0}</div>
                </div>
            `;
            rank++;
        });
    }

    window.shareWhatsApp = () => {
        const text = `नमस्ते! रहली डिजिटल एसेट से जुड़ें और जीतें शानदार रिवॉर्ड्स। मेरा रेफरल कोड है: ${document.getElementById('refCode').innerText}. यहाँ क्लिक करें: ${window.location.href}`;
        window.open(`https://wa.me/?text=${encodeURIComponent(text)}`);
    };

    window.copyRef = () => {
        navigator.clipboard.writeText(document.getElementById('refCode').innerText);
        alert("कोड कॉपी हो गया!");
    };

    window.logout = () => {
        localStorage.removeItem('userMobile');
        location.reload();
    };

    loadUserData();
    loadLeaderboard();
</script>

</body>
</html>
