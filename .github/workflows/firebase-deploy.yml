name: Deploy to Firebase Hosting
on:
  push:
    branches:
      - main
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # यह वार्निंग को दबा देगा

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # यहाँ Firebase डिप्लॉयमेंट का सही फॉर्मेट है
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_REHLI_DIGITAL_ASSET }}'
          projectId: rehli-digital-asset
          channelId: live
