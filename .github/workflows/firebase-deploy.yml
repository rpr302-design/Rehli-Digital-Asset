name: Deploy to Firebase Hosting
on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # यह नोड 20 की पुरानी वार्निंग को पूरी तरह दबा देगा

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      # ✨ अतिरिक्त सुरक्षा: गिटहब रनर को आधिकारिक तौर पर नोड 24 पर सेट करना
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Deploy to Firebase Hosting Live
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_REHLI_DIGITAL_ASSET }}'
          projectId: rehli-digital-asset
          channelId: live
