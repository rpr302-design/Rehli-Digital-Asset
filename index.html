<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>रहली डिजिटल एसेट - होम</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
            color: #2c3e50;
        }
        .profile-box {
            display: none;
            margin-bottom: 20px;
        }
        .profile-box span {
            font-weight: bold;
            color: #27ae60;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9em;
            color: #666;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1em;
            outline: none;
            transition: border 0.3s;
        }
        input:focus {
            border-color: #3498db;
        }
        button {
            width: 100%;
            padding: 11px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        .alert {
            margin-top: 15px;
            font-size: 0.85em;
            color: #c0392b;
            display: none;
        }
        .success {
            margin-top: 15px;
            font-size: 0.85em;
            color: #27ae60;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="profileSection" class="profile-box">
            <h2>स्वागत है! 👋</h2>
            <p>मोबाइल नंबर: <span id="userMobile"></span></p>
            <p style="font-size: 0.8em; color: #7f8c8d; margin-top: 5px;">IP एड्रेस: <span id="userIp"></span></p>
            <button onclick="logout()" style="margin-top: 15px; background-color: #e74c3c;">लॉग आउट</button>
        </div>

        <div id="formSection">
            <h2>रहली डिजिटल एसेट</h2>
            <p style="font-size: 0.9em; color: #666; margin-bottom: 20px;">कृपया अपना मोबाइल नंबर सही दर्ज करें।</p>
            
            <form id="mobileForm">
                <div class="form-group">
                    <label for="phone">मोबाइल नंबर (+91 के साथ):</label>
                    <input type="tel" id="phone" placeholder="9876543210" pattern="[6-9][0-9]{9}" required>
                </div>
                <button type="submit" id="submitBtn">प्रवेश करें</button>
            </form>
            
            <p id="alertMsg" class="alert">चेतावनी: इस IP एड्रेस से पहले ही एक अकाउंट बन चुका है या एक IP से दो अकाउंट चलाना प्रतिबंधित है।</p>
            <p id="successMsg" class="success">सफलतापूर्वक रजिस्टर किया गया!</p>
        </div>
    </div>

    <script type="module">
        // Firebase SDKs 
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

        // Firebase कॉन्फिगरेशन
        const firebaseConfig = {
            apiKey: "AIzaSyAuqo9MoZ9lr4STXztO36n0ASqHOytdAeI",
            authDomain: "rehli-digital-asset.firebaseapp.com",
            projectId: "rehli-digital-asset",
            storageBucket: "rehli-digital-asset.firebasestorage.app",
            messagingSenderId: "779415089179",
            appId: "1:779415089179:web:4f6654088af999ed7ac8be",
            measurementId: "G-1KR9GT1MT6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // IP API का उपयोग करके IP एड्रेस प्राप्त करना
        async function getUserIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip;
            } catch (error) {
                console.error("IP प्राप्त करने में त्रुटि:", error);
                return "Unknown_IP";
            }
        }

        // पेज लोड होने पर चेक करना
        document.addEventListener("DOMContentLoaded", async () => {
            const storedMobile = localStorage.getItem("userMobile");
            const storedIp = localStorage.getItem("userIp");

            if (storedMobile && storedIp) {
                document.getElementById("formSection").style.display = "none";
                document.getElementById("profileSection").style.display = "block";
                document.getElementById("userMobile").innerText = storedMobile;
                document.getElementById("userIp").innerText = storedIp;
            } else {
                window.currentIp = await getUserIP();
                console.log("Current IP:", window.currentIp);
            }
        });

        // फॉर्म सबमिट होने पर प्रक्रिया
        document.getElementById("mobileForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const phoneInput = document.getElementById("phone").value;
            const alertMsg = document.getElementById("alertMsg");
            const successMsg = document.getElementById("successMsg");
            
            alertMsg.style.display = "none";
            successMsg.style.display = "none";

            const ipAddress = window.currentIp || await getUserIP();

            // 1. जांचें कि क्या यह IP पहले से डेटाबेस में मौजूद है
            const q = query(collection(db, "users"), where("ip", "==", ipAddress));
            const querySnapshot = await getDocs(q);

            if (!querySnapshot.empty) {
                alertMsg.style.display = "block";
                return;
            }

            // 2. यदि IP नहीं है, तो नया रिकॉर्ड सेव करें
            try {
                await addDoc(collection(db, "users"), {
                    mobile: phoneInput,
                    ip: ipAddress,
                    timestamp: new Date()
                });

                // लोकल स्टोरेज में सेव करें
                localStorage.setItem("userMobile", phoneInput);
                localStorage.setItem("userIp", ipAddress);

                successMsg.style.display = "block";
                
                setTimeout(() => {
                    location.reload();
                }, 1500);

            } catch (e) {
                console.error("डेटा जोड़ने में त्रुटि: ", e);
            }
        });

        // लॉगआउट फंक्शन 
        window.logout = function() {
            localStorage.clear();
            location.reload();
        }
    </script>
</body>
</html>
