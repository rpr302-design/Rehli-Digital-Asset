<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>रहली डिजिटल एसेट - रिवॉर्ड्स</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #FFD700; --glass: rgba(255, 255, 255, 0.15); }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            margin: 0; display: flex; align-items: center; justify-content: center;
            min-height: 100vh; color: #fff; padding: 15px; overflow: hidden;
        }
        .container {
            width: 100%; max-width: 400px; background: var(--glass);
            padding: 30px; border-radius: 30px; backdrop-filter: blur(20px);
            text-align: center; border: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        input {
            width: 100%; padding: 15px; margin: 15px 0; border: none;
            border-radius: 12px; font-size: 18px; outline: none; text-align: center;
        }
        .btn-action {
            width: 100%; padding: 16px; border: none; border-radius: 15px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            background: linear-gradient(45deg, #f093fb 0%, #f5576c 100%);
            color: white; transition: 0.3s;
        }
        .btn-action:disabled { background: #ccc; cursor: not-allowed; }
        
        /* रिवॉर्ड सेक्शन एनीमेशन */
        #rewardSection { display: none; animation: slideUp 0.6s ease-out; }
        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .coin-display {
            font-size: 50px; font-weight: 700; color: var(--gold);
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.6); margin: 10px 0;
        }
        .safe-img { width: 180px; margin: 20px auto; display: block; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5)); }
        #mobileBox { display: none; background: rgba(0,0,0,0.2); padding: 20px; border-radius: 15px; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <!-- चाबी सेक्शन -->
    <div id="keySection">
        <h2 style="color:var(--gold)">सीक्रेट चाबी <br><small style="font-size:14px; color:white;">Secret Key Unlock</small></h2>
        <p style="font-size: 13px;">यूट्यूब वीडियो से प्राप्त 5 अंकों की चाबी डालें</p>
        <input type="number" id="userKey" placeholder="0 0 0 0 0" oninput="if(this.value.length > 5) this.value = this.value.slice(0, 5);">
        <button class="btn-action" id="unlockBtn" onclick="verifyKey()">खोलें (Unlock Vault)</button>
    </div>

    <!-- रिवॉर्ड सेक्शन -->
    <div id="rewardSection">
        <h2 style="color:#00ff00;">बधाई हो! <br><small style="font-size:14px; color:white;">You Won Coins</small></h2>
        <div class="coin-display" id="winAmount">0</div>
        <img src="https://lh3.googleusercontent.com/d/1rrk784suDVgSiUS8F1GA6HqZgeWia2qT" class="safe-img" alt="Safe Box">
        
        <button class="btn-action" id="claimBtn" onclick="showMobileInput()" style="background: #27ae60;">खाते में जोड़ें (Add to Wallet)</button>

        <div id="mobileBox">
            <p style="font-size:13px;">सिक्के प्राप्त करने के लिए नंबर डालें</p>
            <input type="number" id="claimMobile" placeholder="मोबाइल नंबर (10 अंक)" oninput="if(this.value.length > 10) this.value = this.value.slice(0, 10);">
            <button class="btn-action" onclick="finalizeAccount()">खाता बनाएँ और सिक्के लें</button>
        </div>
    </div>
</div>

<!-- साउंड लोडिंग फिक्स -->
<audio id="winSound" preload="auto">
    <source src="https://docs.google.com/uc?export=download&id=1IG486iet9kCnOR3aWcV1rSsS6XTyckhX" type="audio/mpeg">
</audio>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAuqo9MoZ9lr4STXztO36n0ASqHOytdAeI",
        authDomain: "rehli-digital-asset.firebaseapp.com",
        projectId: "rehli-digital-asset",
        storageBucket: "rehli-digital-asset.firebasestorage.app",
        messagingSenderId: "779415089179",
        appId: "1:779415089179:web:4f6654088af999ed7ac8be"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let wonCoins = 0;

    window.verifyKey = async () => {
        const key = document.getElementById('userKey').value;
        const btn = document.getElementById('unlockBtn');
        const sound = document.getElementById('winSound');

        if (key.length !== 5) {
            alert("कृपया 5 अंकों की चाबी डालें!");
            return;
        }

        btn.disabled = true;
        btn.innerText = "जाँच हो रही है...";

        try {
            const assetRef = doc(db, "assets", key);
            const assetSnap = await getDoc(assetRef);

            if (assetSnap.exists()) {
                wonCoins = assetSnap.data().amount || 0;
                
                // साउंड प्ले करने की कोशिश
                sound.play().catch(e => console.log("Sound error:", e));

                document.getElementById('keySection').style.display = 'none';
                document.getElementById('rewardSection').style.display = 'block';
                document.getElementById('winAmount').innerText = wonCoins;
            } else {
                alert("गलत चाबी! कृपया वीडियो फिर से देखें।");
                btn.disabled = false;
                btn.innerText = "खोलें (Unlock Vault)";
            }
        } catch (e) {
            alert("सर्वर एरर: " + e.message);
            btn.disabled = false;
        }
    };

    window.showMobileInput = () => {
        document.getElementById('claimBtn').style.display = 'none';
        document.getElementById('mobileBox').style.display = 'block';
    };

    window.finalizeAccount = async () => {
        const mobile = document.getElementById('claimMobile').value;
        if (mobile.length !== 10) {
            alert("कृपया 10 अंकों का सही मोबाइल नंबर डालें!");
            return;
        }

        try {
            const userRef = doc(db, "users", mobile);
            const userSnap = await getDoc(userRef);

            if (!userSnap.exists()) {
                // नया यूजर है - खाता बनाएँ
                await setDoc(userRef, {
                    mobile: mobile,
                    balance: wonCoins,
                    regDate: new Date().toISOString(),
                    status: "new"
                });
                alert("बधाई हो! आपका नया खाता बन गया है और " + wonCoins + " सिक्के जोड़ दिए गए हैं।");
            } else {
                // पुराना यूजर है - बैलेंस अपडेट करें (सिक्के जोड़ें)
                const currentBalance = userSnap.data().balance || 0;
                await setDoc(userRef, { balance: currentBalance + wonCoins }, { merge: true });
                alert("सिक्के आपके मौजूदा खाते में जोड़ दिए गए हैं।");
            }

            localStorage.setItem('userMobile', mobile);
            window.location.href = "profile-setup.html"; // प्रोफाइल पूरी करने के लिए भेजें

        } catch (e) {
            alert("डेटा सेव करने में त्रुटि: " + e.message);
        }
    };
</script>

</body>
</html>
