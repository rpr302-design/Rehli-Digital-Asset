<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maths Pro Quiz Portal</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/katex.min.css" />

    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --text-color: #1e293b;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        #quiz-container {
            width: 95%;
            max-width: 650px;
            background: white;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        .header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            color: #64748b;
        }

        .question-text {
            font-size: 1.4rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .options-list {
            display: grid;
            gap: 1rem;
        }

        .option-item {
            padding: 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 0.75rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1.1rem;
        }

        .option-item:hover {
            border-color: var(--primary-color);
            background-color: #eff6ff;
        }

        .option-item.selected {
            border-color: var(--primary-color);
            background-color: var(--primary-color);
            color: white;
        }

        .footer {
            margin-top: 2rem;
            text-align: right;
        }

        #next-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
        }

        #next-btn:disabled {
            background-color: #cbd5e1;
            cursor: not-allowed;
        }

        #result-screen {
            display: none;
            text-align: center;
        }

        .score-display {
            font-size: 4rem;
            font-weight: 800;
            color: var(--primary-color);
            margin: 1rem 0;
        }

        .retry-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="quiz-container">
        <div id="quiz-active">
            <div class="header">
                <span id="q-count">प्रश्न 1 / 3</span>
            </div>
            <div id="question-box" class="question-text">लोड हो रहा है...</div>
            <div id="options-box" class="options-list"></div>
            <div class="footer">
                <button id="next-btn" onclick="handleNext()" disabled>अगला प्रश्न</button>
            </div>
        </div>

        <div id="result-screen">
            <h2>आपका परिणाम</h2>
            <div class="score-display" id="final-score">0</div>
            <p id="feedback-msg"></p>
            <button class="retry-btn" onclick="location.reload()">दोबारा प्रयास करें</button>
        </div>
    </div>

    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/contrib/auto-render.min.js"></script>

    <script>
        const quizData = [
            {
                q: "यदि $x^2 - 5x + 6 = 0$ है, तो $x$ के मूल ज्ञात करें:",
                o: ["$2, 3$", "$-2, -3$", "$1, 6$", "$0, 5$"],
                a: "$2, 3$"
            },
            {
                q: "त्रिकोणमिति सूत्र: $\\sin^2 \\theta + \\cos^2 \\theta$ का मान क्या है?",
                o: ["$0$", "$1$", "$-1$", "$\\infty$"],
                a: "$1$"
            },
            {
                q: "पाइथागोरस प्रमेय का सही रूप क्या है?",
                o: ["$a^2 + b^2 = c^2$", "$a + b = c$", "$a^2 - b^2 = c^2$", "$\\sqrt{a+b} = c$"],
                a: "$a^2 + b^2 = c^2$"
            }
        ];

        let currentIdx = 0;
        let score = 0;
        let selectedOption = null;

        function loadQuestion() {
            const data = quizData[currentIdx];
            document.getElementById('q-count').innerText = `प्रश्न ${currentIdx + 1} / ${quizData.length}`;
            document.getElementById('question-box').innerHTML = data.q;
            
            const oBox = document.getElementById('options-box');
            oBox.innerHTML = "";
            
            data.o.forEach(opt => {
                const div = document.createElement('div');
                div.className = 'option-item';
                div.innerHTML = opt;
                div.onclick = function() {
                    selectedOption = opt;
                    document.querySelectorAll('.option-item').forEach(el => el.classList.remove('selected'));
                    div.classList.add('selected');
                    document.getElementById('next-btn').disabled = false;
                };
                oBox.appendChild(div);
            });

            renderMath();
        }

        function renderMath() {
            // KaTeX rendering with a slight delay to ensure DOM is ready
            setTimeout(() => {
                if (window.renderMathInElement) {
                    renderMathInElement(document.getElementById('quiz-container'), {
                        delimiters: [
                            {left: "$$", right: "$$", display: true},
                            {left: "$", right: "$", display: false}
                        ],
                        throwOnError: false
                    });
                }
            }, 50);
        }

        function handleNext() {
            if (selectedOption === quizData[currentIdx].a) score++;
            
            if (currentIdx < quizData.length - 1) {
                currentIdx++;
                selectedOption = null;
                document.getElementById('next-btn').disabled = true;
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quiz-active').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';
            document.getElementById('final-score').innerText = `${score} / ${quizData.length}`;
            document.getElementById('feedback-msg').innerText = score === quizData.length ? "शानदार प्रदर्शन!" : "अच्छा प्रयास, और सुधार करें।";
            renderMath();
        }

        window.onload = () => {
            setTimeout(loadQuestion, 500);
        };
    </script>
</body>
</html>
