<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>रहली डिजिटल एसेट - रिवॉर्ड्स</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #fff;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.15);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            backdrop-filter: blur(15px);
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
        }

        h2 { font-weight: 600; margin-bottom: 20px; }
        p { font-size: 14px; opacity: 0.9; margin-bottom: 25px; }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            text-align: center;
        }

        .btn-action {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            background: #00d2ff;
            background: linear-gradient(to right, #3a7bd5, #00d2ff);
            color: white;
            transition: 0.3s;
        }

        .btn-action:hover { transform: scale(1.02); }

        .profile-card { display: none; } /* शुरू में छुपा रहेगा */
        .key-section { display: none; }
        
        .user-info {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 10px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- सेक्शन 1: चाबी दर्ज करें (नए यूजर के लिए) -->
    <div id="keySection" class="key-section">
        <h2>स्वागत है! 🎁</h2>
        <p>कृपया यूट्यूब वीडियो से प्राप्त 5 अंकों की सीक्रेट चाबी यहाँ दर्ज करें।</p>
        <input type="number" id="userKey" placeholder="0 0 0 0 0" oninput="if(this.value.length > 5) this.value = this.value.slice(0, 5);">
        <button class="btn-action" onclick="verifyKey()">चाबी की जाँच करें</button>
    </div>

    <!-- सेक्शन 2: यूजर प्रोफाइल (पुराने यूजर के लिए) -->
    <div id="profileSection" class="profile-card">
        <h2>आपकी प्रोफाइल 👤</h2>
        <div class="user-info">
            <p>मोबाइल नंबर: <strong id="displayMobile">---</strong></p>
            <p>स्टेटस: <span style="color: #00ff00;">Verified ✅</span></p>
        </div>
        <button class="btn-action" style="margin-top: 20px;" onclick="goToMysteryBox()">मिस्ट्री बॉक्स खोलें</button>
        <p onclick="logoutUser()" style="margin-top: 15px; cursor: pointer; font-size: 12px; text-decoration: underline;">मोबाइल नंबर बदलें</p>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAuqo9MoZ9lr4STXztO36n0ASqHOytdAeI",
        authDomain: "rehli-digital-asset.firebaseapp.com",
        projectId: "rehli-digital-asset",
        storageBucket: "rehli-digital-asset.firebasestorage.app",
        messagingSenderId: "779415089179",
        appId: "1:779415089179:web:4f6654088af999ed7ac8be"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // पेज लोड होते ही चेक करें
    window.onload = () => {
        const savedMobile = localStorage.getItem('userMobile');
        if (savedMobile) {
            // अगर मोबाइल नंबर सेव है, प्रोफाइल दिखाएँ
            document.getElementById('displayMobile').innerText = savedMobile;
            document.getElementById('profileSection').style.display = 'block';
        } else {
            // अगर नया यूजर है, चाबी सेक्शन दिखाएँ
            document.getElementById('keySection').style.display = 'block';
        }
    };

    // चाबी वेरिफिकेशन फंक्शन
    window.verifyKey = async () => {
        const key = document.getElementById('userKey').value;
        if (key.length !== 5) {
            alert("कृपया 5 अंकों की सही चाबी डालें।");
            return;
        }

        try {
            const docRef = doc(db, "assets", key);
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                // चाबी सही है, अब मोबाइल वेरिफिकेशन पर भेजें
                // यहाँ हम एक प्रॉम्प्ट ले रहे हैं, आप चाहें तो अलग पेज बना सकते हैं
                const mobile = prompt("चाबी सही है! अपना मोबाइल नंबर दर्ज करें:");
                if(mobile && mobile.length >= 10) {
                    localStorage.setItem('userMobile', mobile);
                    location.reload(); // पेज रिफ्रेश करके प्रोफाइल दिखाएँ
                } else {
                    alert("सही मोबाइल नंबर जरूरी है।");
                }
            } else {
                alert("गलत चाबी! कृपया वीडियो फिर से देखें।");
            }
        } catch (error) {
            console.error(error);
            alert("सर्वर से कनेक्ट करने में समस्या आई।");
        }
    };

    window.goToMysteryBox = () => {
        // यहाँ मिस्ट्री बॉक्स वाले पेज का लिंक आएगा
        alert("मिस्ट्री बॉक्स पेज पर जा रहे हैं...");
        // window.location.href = "mystery-box.html";
    };

    window.logoutUser = () => {
        localStorage.removeItem('userMobile');
        location.reload();
    };
</script>

</body>
</html>
