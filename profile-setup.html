<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>प्रोफाइल सेटअप - रहली डिजिटल एसेट</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-bg: #667eea;
            --secondary-bg: #764ba2;
            --glass-bg: #ffffff;
            --accent-color: #764ba2;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--primary-bg) 0%, var(--secondary-bg) 100%);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: var(--glass-bg);
            padding: 35px 25px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }

        .project-name {
            text-align: center;
            font-size: 22px;
            font-weight: 600;
            color: var(--accent-color);
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        h3 { text-align: center; color: #444; margin-bottom: 30px; font-weight: 400; font-size: 16px; }

        .input-group { margin-bottom: 20px; position: relative; }

        label { display: block; margin-bottom: 8px; font-size: 13px; color: #666; font-weight: 600; margin-left: 5px; }

        input, select {
            width: 100%;
            padding: 14px 15px;
            border: 1.5px solid #eee;
            border-radius: 15px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
            box-sizing: border-box;
            background: #f9f9fb;
            color: #333;
        }

        input:focus { border-color: var(--primary-bg); background: #fff; box-shadow: 0 0 10px rgba(102, 126, 234, 0.1); }

        /* नाम को ऑटोमैटिक बड़ा दिखाने के लिए CSS भी मदद करती है */
        #userName { text-transform: uppercase; }

        .pin-container { position: relative; }
        
        .toggle-pin {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #aaa;
            padding: 5px;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 10px 20px rgba(118, 75, 162, 0.3);
            transition: 0.3s;
        }

        .btn-submit:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-submit:active { transform: scale(0.98); }

        /* Mobile specific adjustments */
        @media (max-width: 360px) {
            .container { padding: 25px 20px; }
            .project-name { font-size: 18px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="project-name">रहली डिजिटल एसेट</div>
    <h3>प्रोफाइल सेटअप करें</h3>

    <div class="input-group">
        <label>आपका नाम</label>
        <input type="text" id="userName" placeholder="पूरा नाम दर्ज करें" oninput="this.value = this.value.toUpperCase()">
    </div>

    <div class="input-group">
        <label>लिंग (Gender)</label>
        <select id="userGender">
            <option value="">चुनें</option>
            <option value="Male">पुरुष (Male)</option>
            <option value="Female">महिला (Female)</option>
            <option value="Other">अन्य (Other)</option>
        </select>
    </div>

    <div class="input-group">
        <label>मोबाइल नंबर</label>
        <input type="number" id="userMobile" placeholder="10 अंकों का मोबाइल नंबर">
    </div>

    <div class="input-group">
        <label>सुरक्षा पिन (4 अंक)</label>
        <div class="pin-container">
            <input type="password" id="userPin" placeholder="यूनिक पिन चुनें" maxlength="4" pattern="\d*" inputmode="numeric" oninput="if(this.value.length > 4) this.value = this.value.slice(0, 4);">
            <i class="fa-solid fa-eye toggle-pin" onclick="togglePin('userPin')"></i>
        </div>
    </div>

    <div class="input-group">
        <label>पिन पुनः दर्ज करें</label>
        <div class="pin-container">
            <input type="password" id="confirmPin" placeholder="पिन कन्फर्म करें" maxlength="4" pattern="\d*" inputmode="numeric">
            <i class="fa-solid fa-eye toggle-pin" onclick="togglePin('confirmPin')"></i>
        </div>
    </div>

    <button class="btn-submit" onclick="registerUser()">प्रोफाइल सुरक्षित करें</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAuqo9MoZ9lr4STXztO36n0ASqHOytdAeI",
        authDomain: "rehli-digital-asset.firebaseapp.com",
        projectId: "rehli-digital-asset",
        storageBucket: "rehli-digital-asset.firebasestorage.app",
        messagingSenderId: "779415089179",
        appId: "1:779415089179:web:4f6654088af999ed7ac8be"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.togglePin = (id) => {
        const input = document.getElementById(id);
        const icon = input.nextElementSibling;
        if (input.type === "password") {
            input.type = "text";
            icon.classList.replace("fa-eye", "fa-eye-slash");
        } else {
            input.type = "password";
            icon.classList.replace("fa-eye-slash", "fa-eye");
        }
    };

    window.registerUser = async () => {
        const name = document.getElementById('userName').value.trim().toUpperCase();
        const gender = document.getElementById('userGender').value;
        const mobile = document.getElementById('userMobile').value.trim();
        const pin = document.getElementById('userPin').value;
        const cPin = document.getElementById('confirmPin').value;

        // कमजोर पिन की लिस्ट
        const weakPins = ["1234", "1111", "2222", "3333", "4444", "5555", "6666", "7777", "8888", "9999", "0000", "4321", "2580"];

        if (!name || !gender || mobile.length < 10 || pin.length !== 4) {
            alert("कृपया सभी जानकारी सही से भरें (मोबाइल 10 अंक और पिन 4 अंक)।");
            return;
        }

        if (weakPins.includes(pin)) {
            alert("यह पिन बहुत साधारण है! सुरक्षा के लिए कृपया कोई यूनिक पिन चुनें (जैसे 5821)।");
            return;
        }

        if (pin !== cPin) {
            alert("दोनों पिन आपस में नहीं मिल रहे हैं!");
            return;
        }

        try {
            await setDoc(doc(db, "users", mobile), {
                userName: name,
                gender: gender,
                mobile: mobile,
                pin: pin,
                regDate: new Date().toISOString()
            });

            localStorage.setItem('userMobile', mobile);
            alert("बधाई हो " + name + "! आपकी प्रोफाइल सुरक्षित कर दी गई है। ✅");
            window.location.href = "index.html"; 

        } catch (error) {
            alert("त्रुटि: " + error.message);
        }
    };
</script>

</body>
</html>
