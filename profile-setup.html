<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>प्रोफाइल सेटअप - रहली डिजिटल एसेट</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-bg: #667eea;
            --secondary-bg: #764ba2;
            --glass-bg: #ffffff;
            --accent-color: #764ba2;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--primary-bg) 0%, var(--secondary-bg) 100%);
            margin: 0; display: flex; align-items: center; justify-content: center;
            min-height: 100vh; padding: 15px; overflow-x: hidden;
        }

        .container {
            width: 100%; max-width: 400px; background: var(--glass-bg);
            padding: 35px 25px; border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3); box-sizing: border-box;
        }

        .project-name { text-align: center; font-size: 22px; font-weight: 600; color: var(--accent-color); text-transform: uppercase; }
        h3 { text-align: center; color: #444; margin-bottom: 25px; font-weight: 400; font-size: 15px; }

        .input-group { margin-bottom: 18px; position: relative; }
        label { display: block; margin-bottom: 6px; font-size: 13px; color: #666; font-weight: 600; margin-left: 5px; }

        input, select {
            width: 100%; padding: 14px; border: 1.5px solid #eee; border-radius: 12px;
            font-size: 15px; outline: none; transition: 0.3s; box-sizing: border-box; background: #f9f9fb;
        }
        input:focus { border-color: var(--primary-bg); background: #fff; }

        #customToast {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 20px 30px; border-radius: 15px; color: white; font-weight: 600;
            text-align: center; z-index: 2000; display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: fadeIn 0.4s ease; min-width: 280px;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translate(-50%, -60%); } to { opacity: 1; transform: translate(-50%, -50%); } }

        .btn-submit {
            width: 100%; padding: 16px; background: linear-gradient(to right, #667eea, #764ba2);
            color: white; border: none; border-radius: 15px; font-size: 16px; font-weight: 600;
            cursor: pointer; margin-top: 10px; box-shadow: 0 10px 20px rgba(118, 75, 162, 0.3);
        }

        .pin-container { position: relative; }
        .toggle-pin { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #aaa; }
    </style>
</head>
<body>

<div id="customToast"></div>

<div class="container">
    <div class="project-name">रहली डिजिटल एसेट</div>
    <h3>प्रोफाइल सेटअप करें</h3>

    <div class="input-group">
        <label>आपका नाम</label>
        <input type="text" id="userName" placeholder="पूरा नाम दर्ज करें" oninput="this.value = this.value.toUpperCase()">
    </div>

    <div class="input-group">
        <label>लिंग (Gender)</label>
        <select id="userGender">
            <option value="">चुनें</option>
            <option value="Male">पुरुष</option>
            <option value="Female">महिला</option>
        </select>
    </div>

    <div class="input-group">
        <label>मोबाइल नंबर</label>
        <input type="number" id="userMobile" placeholder="10 अंकों का नंबर">
    </div>

    <div class="input-group">
        <label>सुरक्षा पिन (4 अंक)</label>
        <div class="pin-container">
            <input type="password" id="userPin" placeholder="यूनिक पिन चुनें" maxlength="4">
            <i class="fa-solid fa-eye toggle-pin" onclick="togglePin('userPin')"></i>
        </div>
    </div>

    <div class="input-group">
        <label>पिन पुनः दर्ज करें</label>
        <div class="pin-container">
            <input type="password" id="confirmPin" placeholder="पिन कन्फर्म करें" maxlength="4">
            <i class="fa-solid fa-eye toggle-pin" onclick="togglePin('confirmPin')"></i>
        </div>
    </div>

    <button class="btn-submit" id="mainBtn" onclick="registerUser()">प्रोफाइल सुरक्षित करें</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAuqo9MoZ9lr4STXztO36n0ASqHOytdAeI",
        authDomain: "rehli-digital-asset.firebaseapp.com",
        projectId: "rehli-digital-asset",
        storageBucket: "rehli-digital-asset.firebasestorage.app",
        messagingSenderId: "779415089179",
        appId: "1:779415089179:web:4f6654088af999ed7ac8be"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const messaging = getMessaging(app);

    const vapidKey = 'BMp3NxQuOe2ir5RqIymFoYyP3Y6c3UUssIVXdYugXsWj1Kg5oOlZJN2MlzaH-vRG1Iz508LOGytTsemzSGNbDFk';

    window.showToast = (msg, type) => {
        const toast = document.getElementById('customToast');
        toast.innerText = msg;
        toast.style.display = "block";
        toast.style.background = type === 'error' ? '#e74c3c' : '#27ae60';
        setTimeout(() => { toast.style.display = "none"; }, 3000);
    };

    window.togglePin = (id) => {
        const input = document.getElementById(id);
        const icon = input.nextElementSibling;
        input.type = input.type === "password" ? "text" : "password";
        icon.classList.toggle("fa-eye-slash");
    };

    window.registerUser = async () => {
        const name = document.getElementById('userName').value.trim().toUpperCase();
        const mobile = document.getElementById('userMobile').value.trim();
        const pin = document.getElementById('userPin').value;
        const cPin = document.getElementById('confirmPin').value;
        const gender = document.getElementById('userGender').value;
        const btn = document.getElementById('mainBtn');

        if (!name || mobile.length < 10 || pin.length !== 4) {
            showToast("जानकारी सही भरें!", "error");
            return;
        }
        if (pin !== cPin) {
            showToast("पिन मैच नहीं हुए!", "error");
            return;
        }

        btn.disabled = true;
        btn.innerText = "प्रोसेसिंग...";

        try {
            const userRef = doc(db, "users", mobile);
            const userSnap = await getDoc(userRef);

            if (userSnap.exists()) {
                showToast("यह नंबर पहले से रजिस्टर है!", "error");
                btn.disabled = false;
                btn.innerText = "प्रोफाइल सुरक्षित करें";
                return;
            }

            // 1. नोटिफिकेशन परमिशन मांगें
            const permission = await Notification.requestPermission();
            let fcmToken = null;

            if (permission === 'granted') {
                try {
                    fcmToken = await getToken(messaging, { vapidKey: vapidKey });
                } catch (e) { console.log("Token Fetch Error:", e); }
            }

            // 2. डेटा सेव करें
            await setDoc(userRef, {
                userName: name,
                gender: gender,
                mobile: mobile,
                pin: pin,
                fcmToken: fcmToken,
                regDate: new Date().toISOString()
            });

            showToast("प्रोफाइल सुरक्षित हो गई! ✅", "success");
            localStorage.setItem('userMobile', mobile);
            setTimeout(() => { window.location.href = "index.html"; }, 2000);

        } catch (error) {
            showToast("त्रुटि: " + error.message, "error");
            btn.disabled = false;
            btn.innerText = "प्रोफाइल सुरक्षित करें";
        }
    };
</script>

</body>
</html>
