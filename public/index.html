<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>अनलॉक - रहली डिजिटल एसेट</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #FFD700; --glass: rgba(255, 255, 255, 0.15); }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            margin: 0; display: flex; align-items: center; justify-content: center;
            min-height: 100vh; color: #fff; padding: 15px; overflow: hidden;
        }
        .container {
            width: 100%; max-width: 400px; background: var(--glass);
            padding: 30px; border-radius: 30px; backdrop-filter: blur(20px);
            text-align: center; border: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        input {
            width: 100%; padding: 15px; margin: 15px 0; border: none;
            border-radius: 12px; font-size: 18px; outline: none; text-align: center; color: #333;
        }
        .btn-action {
            width: 100%; padding: 16px; border: none; border-radius: 15px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            background: linear-gradient(45deg, #f093fb 0%, #f5576c 100%);
            color: white; transition: 0.3s;
        }
        #rewardSection, #mobileBox { display: none; }
        .coin-display { font-size: 50px; font-weight: 700; color: var(--gold); }
        .safe-img { width: 180px; margin: 20px auto; display: block; }
    </style>
</head>
<body>

<div class="container">
    <!-- सेक्शन 1: चाबी एंट्री -->
    <div id="keySection">
        <h2 style="color:var(--gold)">सीक्रेट चाबी अनलॉक</h2>
        <p style="font-size: 13px;">वीडियो से मिली 5 अंकों की चाबी यहाँ डालें</p>
        <input type="number" id="userKey" placeholder="0 0 0 0 0" oninput="if(this.value.length > 5) this.value = this.value.slice(0, 5);">
        <button class="btn-action" id="unlockBtn" onclick="verifyKey()">अनलॉक करें</button>
    </div>

    <!-- सेक्शन 2: रिवॉर्ड एनीमेशन -->
    <div id="rewardSection">
        <h2 style="color:#00ff00;">बधाई हो!</h2>
        <div class="coin-display" id="winAmount">0</div>
        <img src="https://lh3.googleusercontent.com/d/1rrk784suDVgSiUS8F1GA6HqZgeWia2qT" class="safe-img" alt="Safe">
        <button class="btn-action" id="claimBtn" onclick="showMobileInput()" style="background: #27ae60;">खाते में जोड़ें</button>

        <div id="mobileBox">
            <input type="number" id="claimMobile" placeholder="मोबाइल नंबर (10 अंक)" oninput="if(this.value.length > 10) this.value = this.value.slice(0, 10);">
            <button class="btn-action" onclick="finalizeAccount()">पुष्टि करें</button>
        </div>
    </div>
</div>

<audio id="winSound">
    <source src="https://docs.google.com/uc?export=download&id=1IG486iet9kCnOR3aWcV1rSsS6XTyckhX" type="audio/mpeg">
</audio>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAuqo9MoZ9lr4STXztO36n0ASqHOytdAeI",
        authDomain: "rehli-digital-asset.firebaseapp.com",
        projectId: "rehli-digital-asset",
        storageBucket: "rehli-digital-asset.firebasestorage.app",
        messagingSenderId: "779415089179",
        appId: "1:779415089179:web:4f6654088af999ed7ac8be"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let wonCoins = 0;

    // पेज लोड होते ही रेफरल कोड चेक करें
    window.onload = () => {
        const urlParams = new URLSearchParams(window.location.search);
        const ref = urlParams.get('ref');
        if (ref) sessionStorage.setItem('referredBy', ref);
    };

    window.verifyKey = async () => {
        const key = document.getElementById('userKey').value;
        if (key.length !== 5) return alert("5 अंकों की चाबी डालें");

        const assetSnap = await getDoc(doc(db, "assets", key));
        if (assetSnap.exists()) {
            wonCoins = assetSnap.data().value || 0;
            document.getElementById('winSound').play();
            document.getElementById('keySection').style.display = 'none';
            document.getElementById('rewardSection').style.display = 'block';
            document.getElementById('winAmount').innerText = wonCoins;
        } else {
            alert("गलत चाबी!");
        }
    };

    window.showMobileInput = () => {
        document.getElementById('claimBtn').style.display = 'none';
        document.getElementById('mobileBox').style.display = 'block';
    };

    window.finalizeAccount = async () => {
        const mobile = document.getElementById('claimMobile').value;
        if (mobile.length !== 10) return alert("सही मोबाइल नंबर डालें");

        const userRef = doc(db, "users", mobile);
        const userSnap = await getDoc(userRef);

        if (!userSnap.exists()) {
            await setDoc(userRef, {
                mobile: mobile,
                balance: wonCoins,
                regDate: new Date().toISOString()
            });
        } else {
            const currentBal = userSnap.data().balance || 0;
            await setDoc(userRef, { balance: currentBal + wonCoins }, { merge: true });
        }

        localStorage.setItem('userMobile', mobile);
        window.location.href = "profile-setup.html";
    };
</script>
</body>
</html>
