<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>रहली डिजिटल एसेट - रिवॉर्ड्स</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div id="keySection">
        <h2>नमस्ते! रिवॉर्ड्स अनलॉक करें 🎁</h2>
        <span class="lang-en">Welcome! Unlock Your Rewards</span>
        <p style="font-size: 13px;">कृपया वीडियो से प्राप्त 5 अंकों की चाबी डालें</p>
        <input type="number" id="userKey" placeholder="0 0 0 0 0" oninput="if(this.value.length > 5) this.value = this.value.slice(0, 5);">
        <button class="btn-action" onclick="verifyKey()">चाबी की जाँच करें (Check Key)</button>
    </div>

    <div id="rewardSection">
        <div class="coin-display shiny" id="winAmount">0</div>
        <p style="color:var(--gold); font-weight: bold; margin-bottom: 20px;">GOLD ASSETS WON!</p>
        
        <img src="https://lh3.googleusercontent.com/d/1rrk784suDVgSiUS8F1GA6HqZgeWia2qT" class="safe-img" alt="Vault">
        
        <button class="btn-action" id="claimBtn" onclick="showMobileInput()" style="background: linear-gradient(to right, #11998e, #38ef7d);">सिक्के खाते में जोड़ें (Add to Account)</button>

        <div id="mobileBox">
            <p style="font-size: 13px;">सिक्के प्राप्त करने के लिए मोबाइल नंबर दर्ज करें</p>
            <input type="number" id="userMobile" placeholder="आपका मोबाइल नंबर">
            <button class="btn-action" onclick="saveMobile()">पुष्टि करें (Confirm)</button>
        </div>
    </div>
</div>

<audio id="winSound">
    <source src="https://docs.google.com/uc?export=download&id=1IG486iet9kCnOR3aWcV1rSsS6XTyckhX" type="audio/mpeg">
</audio>

<script type="module" src="app.js"></script>

</body>
</html>
