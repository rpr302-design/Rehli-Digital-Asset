<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>रहली डिजिटल एसेट - रिवॉर्ड्स</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #FFD700;
            --glass: rgba(255, 255, 255, 0.15);
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            margin: 0; display: flex; align-items: center; justify-content: center;
            min-height: 100vh; color: #fff; padding: 15px; overflow: hidden;
        }

        .container {
            width: 100%; max-width: 400px; background: var(--glass);
            padding: 30px; border-radius: 30px; backdrop-filter: blur(20px);
            text-align: center; border: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        h2 { font-weight: 600; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        .lang-en { font-size: 12px; opacity: 0.8; display: block; margin-bottom: 20px; }

        input {
            width: 100%; padding: 15px; margin-bottom: 15px; border: none;
            border-radius: 15px; font-size: 18px; outline: none;
            text-align: center; background: white; color: #333; font-weight: 600;
        }

        .btn-action {
            width: 100%; padding: 16px; border: none; border-radius: 15px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            background: linear-gradient(45deg, #f093fb 0%, #f5576c 100%);
            color: white; transition: 0.3s; box-shadow: 0 5px 15px rgba(245, 87, 108, 0.4);
        }
        .btn-action:hover { transform: translateY(-3px); }

        /* रिवॉर्ड और तिजोरी स्टाइल */
        #rewardSection { display: none; }
        .safe-img { width: 100%; max-width: 220px; margin: 20px auto; animation: pop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }

        .coin-display {
            font-size: 40px; font-weight: 700; color: var(--gold);
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.7), 2px 2px 2px #000;
            margin-bottom: 5px;
        }
        .shiny { animation: shine 2s infinite; }
        @keyframes shine { 0% { opacity: 0.8; } 50% { opacity: 1; text-shadow: 0 0 30px var(--gold); } 100% { opacity: 0.8; } }

        #mobileBox { display: none; margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <!-- सेक्शन 1: चाबी एंट्री -->
    <div id="keySection">
        <h2>नमस्ते! रिवॉर्ड्स अनलॉक करें 🎁</h2>
        <span class="lang-en">Welcome! Unlock Your Rewards</span>
        <p style="font-size: 13px;">कृपया वीडियो से प्राप्त 5 अंकों की चाबी डालें</p>
        <input type="number" id="userKey" placeholder="0 0 0 0 0" oninput="if(this.value.length > 5) this.value = this.value.slice(0, 5);">
        <button class="btn-action" onclick="verifyKey()">चाबी की जाँच करें (Check Key)</button>
    </div>

    <!-- सेक्शन 2: तिजोरी और कॉइन रिवॉर्ड -->
    <div id="rewardSection">
        <div class="coin-display shiny" id="winAmount">0</div>
        <p style="color:var(--gold); font-weight: bold; margin-bottom: 20px;">GOLD ASSETS WON!</p>
        
        <!-- तिजोरी इमेज (Google Drive Direct Link Fix) -->
        <img src="https://lh3.googleusercontent.com/d/1rrk784suDVgSiUS8F1GA6HqZgeWia2qT" class="safe-img" alt="Vault">
        
        <button class="btn-action" id="claimBtn" onclick="showMobileInput()" style="background: linear-gradient(to right, #11998e, #38ef7d);">सिक्के खाते में जोड़ें (Add to Account)</button>

        <!-- मोबाइल नंबर इनपुट (छिपा हुआ) -->
        <div id="mobileBox">
            <p style="font-size: 13px;">सिक्के प्राप्त करने के लिए मोबाइल नंबर दर्ज करें</p>
            <input type="number" id="userMobile" placeholder="आपका मोबाइल नंबर">
            <button class="btn-action" onclick="saveMobile()">पुष्टि करें (Confirm)</button>
        </div>
    </div>
</div>

<!-- साउंड लोडर -->
<audio id="winSound">
    <source src="https://docs.google.com/uc?export=download&id=1IG486iet9kCnOR3aWcV1rSsS6XTyckhX" type="audio/mpeg">
</audio>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAuqo9MoZ9lr4STXztO36n0ASqHOytdAeI",
        authDomain: "rehli-digital-asset.firebaseapp.com",
        projectId: "rehli-digital-asset",
        storageBucket: "rehli-digital-asset.firebasestorage.app",
        messagingSenderId: "779415089179",
        appId: "1:779415089179:web:4f6654088af999ed7ac8be"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // चाबी वेरिफिकेशन
    window.verifyKey = async () => {
        const key = document.getElementById('userKey').value;
        if (key.length !== 5) {
            alert("कृपया 5 अंकों की सही चाबी डालें।");
            return;
        }

        try {
            const docRef = doc(db, "assets", key);
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                const amount = docSnap.data().value || 100; // फायरबेस से सिक्के उठाएगा
                
                // 1. साउंड बजाएं
                document.getElementById('winSound').play();

                // 2. UI बदलें
                document.getElementById('keySection').style.display = 'none';
                document.getElementById('rewardSection').style.display = 'block';
                document.getElementById('winAmount').innerText = amount + " COINS";
                
            } else {
                alert("गलत चाबी! कृपया वीडियो फिर से देखें।");
            }
        } catch (error) {
            console.error(error);
            alert("सर्वर एरर!");
        }
    };

    window.showMobileInput = () => {
        document.getElementById('claimBtn').style.display = 'none';
        document.getElementById('mobileBox').style.display = 'block';
    };

    window.saveMobile = () => {
        const mobile = document.getElementById('userMobile').value;
        if (mobile && mobile.length >= 10) {
            localStorage.setItem('userMobile', mobile);
            alert("सफलता! रिवॉर्ड आपके खाते में जोड़ दिया गया है।");
            location.reload();
        } else {
            alert("कृपया सही मोबाइल नंबर डालें।");
        }
    };
</script>

</body>
</html>
