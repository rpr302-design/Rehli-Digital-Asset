<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>रहली डिजिटल एसेट - एडमिन पैनल</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4facfe;
            --secondary-color: #00f2fe;
            --danger-color: #ff4b2b;
            --text-color: #333;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }

        h2 {
            text-align: center;
            color: var(--text-color);
            margin-bottom: 25px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #666;
            margin-left: 5px;
        }

        input, select {
            width: 100%;
            padding: 14px;
            border: 2px solid #eee;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            box-sizing: border-box;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 8px rgba(79, 172, 254, 0.3);
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            color: white;
            background: linear-gradient(to right, #4facfe 0%, #00f2fe 100%);
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-logout {
            background: linear-gradient(to right, #ff416c, #ff4b2b);
            box-shadow: 0 4px 15px rgba(255, 75, 43, 0.3);
            margin-top: 20px;
        }

        #adminForm { display: none; }

        /* Success Animation */
        .success-msg {
            display: none;
            color: #28a745;
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- लॉगिन सेक्शन -->
    <div id="loginSection">
        <h2>🔒 एडमिन लॉगिन</h2>
        <div class="input-group">
            <input type="email" id="adminEmail" placeholder="ईमेल" value="rpr302@gmail.com">
        </div>
        <div class="input-group">
            <input type="password" id="adminPass" placeholder="पासवर्ड" value="Sammo*1234">
        </div>
        <button onclick="login()">लॉगिन करें</button>
    </div>

    <!-- डेटा एंट्री फॉर्म -->
    <div id="adminForm">
        <h2>🛠️ एसेट मैनेजमेंट</h2>
        
        <div class="input-group">
            <label>प्लेटफार्म चुनें</label>
            <select id="platform">
                <option value="YouTube">📺 YouTube</option>
                <option value="Facebook">👥 Facebook</option>
                <option value="Instagram">📸 Instagram</option>
            </select>
        </div>
        
        <div class="input-group">
            <input type="text" id="videoTitle" placeholder="वीडियो का टाइटल दर्ज करें">
        </div>

        <div class="input-group">
            <input type="number" id="assetKey" placeholder="5 अंकों की सीक्रेट चाबी" 
                   oninput="if(this.value.length > 5) this.value = this.value.slice(0, 5);">
        </div>
        
        <button onclick="submitData()">फायरबेस में सेव करें</button>
        <div id="successMessage" class="success-msg">डेटा सेव हो गया! ✅</div>
        
        <button onclick="logout()" class="btn-logout">लॉगआउट</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAuqo9MoZ9lr4STXztO36n0ASqHOytdAeI",
        authDomain: "rehli-digital-asset.firebaseapp.com",
        projectId: "rehli-digital-asset",
        storageBucket: "rehli-digital-asset.firebasestorage.app",
        messagingSenderId: "779415089179",
        appId: "1:779415089179:web:4f6654088af999ed7ac8be"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.login = async () => {
        const email = document.getElementById('adminEmail').value;
        const pass = document.getElementById('adminPass').value;
        try {
            await signInWithEmailAndPassword(auth, email, pass);
        } catch (error) {
            alert("लॉगिन त्रुटि: " + error.message);
        }
    };

    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('adminForm').style.display = 'block';
        } else {
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('adminForm').style.display = 'none';
        }
    });

    window.submitData = async () => {
        const platform = document.getElementById('platform').value;
        const title = document.getElementById('videoTitle').value;
        const key = document.getElementById('assetKey').value;
        const msg = document.getElementById('successMessage');

        if(key.length !== 5 || title === "") {
            alert("कृपया टाइटल और 5 अंकों की चाबी भरें।");
            return;
        }

        try {
            await setDoc(doc(db, "assets", key), {
                platform: platform,
                title: title,
                key: key,
                timestamp: new Date()
            });
            
            msg.style.display = "block";
            document.getElementById('videoTitle').value = "";
            document.getElementById('assetKey').value = "";
            
            setTimeout(() => { msg.style.display = "none"; }, 3000);
        } catch (error) {
            alert("त्रुटि: " + error.message);
        }
    };

    window.logout = () => signOut(auth);
</script>

</body>
</html>
