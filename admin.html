<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>रहली डिजिटल एसेट - प्रो एडमिन</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --sidebar-bg: #2c3e50;
            --main-bg: #f4f7f6;
            --accent: #3498db;
            --white: #ffffff;
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            background-color: var(--main-bg);
        }

        /* लॉगिन स्क्रीन का स्टाइल */
        #loginWrapper {
            position: fixed; top:0; left:0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex; align-items: center; justify-content: center; z-index: 1000;
        }
        .login-box {
            background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%; max-width: 350px; text-align: center;
        }

        /* साइडबार स्टाइल */
        .sidebar {
            width: 260px; background: var(--sidebar-bg); color: white;
            display: flex; flex-direction: column; transition: 0.3s;
        }
        .sidebar-header { padding: 20px; text-align: center; font-weight: 600; font-size: 20px; border-bottom: 1px solid #34495e; }
        .nav-link {
            padding: 15px 25px; color: #bdc3c7; text-decoration: none; display: flex; align-items: center; cursor: pointer; transition: 0.3s;
        }
        .nav-link i { margin-right: 15px; }
        .nav-link:hover, .nav-link.active { background: #34495e; color: white; border-left: 4px solid var(--accent); }

        /* मेन कंटेंट */
        .main-content { flex: 1; overflow-y: auto; padding: 30px; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 15px; display: flex; align-items: center; }
        .stat-icon { font-size: 40px; color: var(--accent); margin-right: 20px; }

        input, select {
            width: 100%; padding: 12px; margin-top: 8px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box;
        }

        .btn {
            background: var(--accent); color: white; border: none; padding: 12px 25px;
            border-radius: 10px; cursor: pointer; font-weight: 600; margin-top: 15px; width: 100%;
        }

        .key-box {
            background: #e8f4fd; padding: 15px; border-radius: 10px; text-align: center;
            font-size: 24px; font-weight: bold; color: #2c3e50; border: 2px dashed var(--accent); margin-top: 10px;
        }

        #adminPanel { display: none; width: 100%; height: 100%; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- लॉगिन सेक्शन -->
    <div id="loginWrapper">
        <div class="login-box">
            <h2>🔒 एडमिन लॉगिन</h2>
            <input type="email" id="adminEmail" value="rpr302@gmail.com">
            <input type="password" id="adminPass" value="Sammo*1234">
            <button class="btn" onclick="login()">लॉगिन करें</button>
        </div>
    </div>

    <!-- मुख्य पैनल -->
    <div id="adminPanel">
        <div class="sidebar">
            <div class="sidebar-header">रहली डिजिटल</div>
            <div class="nav-link active" onclick="showTab('dashboard')"><i class="fas fa-home"></i> डैशबोर्ड</div>
            <div class="nav-link" onclick="showTab('entry')"><i class="fas fa-plus-circle"></i> एसेट एंट्री</div>
            <div class="nav-link" onclick="logout()" style="margin-top: auto; color: #e74c3c;"><i class="fas fa-sign-out-alt"></i> लॉगआउट</div>
        </div>

        <div class="main-content">
            <!-- डैशबोर्ड टैब -->
            <div id="tab-dashboard">
                <h2>डैशबोर्ड</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <i class="fas fa-users stat-icon"></i>
                        <div><h3 id="countUsers">0</h3><p>कुल यूजर्स</p></div>
                    </div>
                    <div class="stat-card">
                        <i class="fas fa-key stat-icon"></i>
                        <div><h3 id="countAssets">0</h3><p>कुल चाबियां</p></div>
                    </div>
                </div>
            </div>

            <!-- एंट्री टैब -->
            <div id="tab-entry" class="hidden">
                <div class="card" style="max-width: 500px;">
                    <h2>🛠️ नया एसेट दर्ज करें</h2>
                    <label>प्लेटफार्म</label>
                    <select id="platform">
                        <option value="YouTube">YouTube</option>
                        <option value="Facebook">Facebook</option>
                        <option value="Instagram">Instagram</option>
                    </select>

                    <label style="margin-top: 15px; display: block;">वीडियो टाइटल</label>
                    <input type="text" id="videoTitle" placeholder="टाइटल लिखें...">

                    <button class="btn" style="background: #27ae60;" onclick="generateUniqueKey()">चाबी जनरेट करें</button>
                    
                    <div id="keyDisplay" class="key-box">-----</div>
                    <p style="font-size: 11px; color: #7f8c8d; text-align: center;">*चाबी फायरबेस में चेक करके ऑटो-जनरेट की गई है</p>

                    <button id="saveBtn" class="btn" disabled onclick="submitData()">डेटा सेव करें</button>
                </div>
            </div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, collection, getCountFromServer } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAuqo9MoZ9lr4STXztO36n0ASqHOytdAeI",
        authDomain: "rehli-digital-asset.firebaseapp.com",
        projectId: "rehli-digital-asset",
        storageBucket: "rehli-digital-asset.firebasestorage.app",
        messagingSenderId: "779415089179",
        appId: "1:779415089179:web:4f6654088af999ed7ac8be"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let generatedKey = "";

    // लॉगिन फंक्शन
    window.login = async () => {
        const email = document.getElementById('adminEmail').value;
        const pass = document.getElementById('adminPass').value;
        try { await signInWithEmailAndPassword(auth, email, pass); } 
        catch (e) { alert("लॉगिन विफल!"); }
    };

    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('loginWrapper').classList.add('hidden');
            document.getElementById('adminPanel').style.display = 'flex';
            loadStats();
        } else {
            document.getElementById('loginWrapper').classList.remove('hidden');
            document.getElementById('adminPanel').style.display = 'none';
        }
    });

    // टैब स्विचिंग
    window.showTab = (tabName) => {
        document.getElementById('tab-dashboard').classList.add('hidden');
        document.getElementById('tab-entry').classList.add('hidden');
        document.getElementById('tab-' + tabName).classList.remove('hidden');
        
        document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
        event.currentTarget.classList.add('active');
        if(tabName === 'dashboard') loadStats();
    };

    // डैशबोर्ड डेटा लोड करना
    async function loadStats() {
        const userSnap = await getCountFromServer(collection(db, "users"));
        const assetSnap = await getCountFromServer(collection(db, "assets"));
        document.getElementById('countUsers').innerText = userSnap.data().count;
        document.getElementById('countAssets').innerText = assetSnap.data().count;
    }

    // ऑटो चाबी जनरेशन (Unique Check)
    window.generateUniqueKey = async () => {
        let isUnique = false;
        let newKey = "";

        while (!isUnique) {
            newKey = Math.floor(10000 + Math.random() * 90000).toString();
            const docRef = doc(db, "assets", newKey);
            const docSnap = await getDoc(docRef);
            if (!docSnap.exists()) isUnique = true;
        }

        generatedKey = newKey;
        document.getElementById('keyDisplay').innerText = generatedKey;
        document.getElementById('saveBtn').disabled = false;
    };

    // डेटा सेव करना
    window.submitData = async () => {
        const platform = document.getElementById('platform').value;
        const title = document.getElementById('videoTitle').value;

        if(!title) { alert("टाइटल भरें!"); return; }

        try {
            await setDoc(doc(db, "assets", generatedKey), {
                platform: platform,
                title: title,
                key: generatedKey,
                timestamp: new Date()
            });
            alert("सक्सेस! चाबी: " + generatedKey);
            document.getElementById('videoTitle').value = "";
            document.getElementById('keyDisplay').innerText = "-----";
            document.getElementById('saveBtn').disabled = true;
            loadStats();
        } catch (e) { alert("एरर!"); }
    };

    window.logout = () => signOut(auth);
</script>
</body>
</html>
