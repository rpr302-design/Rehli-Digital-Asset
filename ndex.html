<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>रहली डिजिटल एसेट - रिवॉर्ड्स</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #FFD700; --glass: rgba(255, 255, 255, 0.15); --error: #ff4757; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            margin: 0; display: flex; align-items: center; justify-content: center;
            min-height: 100vh; color: #fff; padding: 15px; overflow: hidden;
        }
        .container {
            width: 100%; max-width: 400px; background: var(--glass);
            padding: 30px; border-radius: 30px; backdrop-filter: blur(20px);
            text-align: center; border: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); position: relative;
        }
        input {
            width: 100%; padding: 15px; margin: 15px 0; border: none;
            border-radius: 12px; font-size: 18px; outline: none; text-align: center; background: #fff;
        }
        .btn-action {
            width: 100%; padding: 16px; border: none; border-radius: 15px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            background: linear-gradient(45deg, #f093fb 0%, #f5576c 100%);
            color: white; transition: 0.3s;
        }

        /* सुंदर अलर्ट स्टाइल */
        #customAlert {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 20px; border-radius: 20px; background: #fff; color: #333;
            width: 80%; max-width: 300px; display: none; z-index: 1000;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4); text-align: center;
            animation: popIn 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }
        @keyframes popIn { from { transform: translate(-50%, -50%) scale(0.5); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }

        .coin-display { font-size: 55px; font-weight: 700; color: var(--gold); text-shadow: 0 0 20px rgba(255, 215, 0, 0.6); }
        .safe-img { width: 160px; margin: 15px auto; display: block; }
        #rewardSection, #mobileBox { display: none; }
    </style>
</head>
<body>

<!-- सुंदर अलर्ट बॉक्स -->
<div id="customAlert">
    <div id="alertIcon" style="font-size: 40px; margin-bottom: 10px;">⚠️</div>
    <div id="alertTitle" style="font-weight: 600; font-size: 18px;">ओह!</div>
    <div id="alertMsg" style="font-size: 14px; margin: 10px 0; color: #666;"></div>
    <button class="btn-action" style="padding: 10px; font-size: 14px;" onclick="closeAlert()">ठीक है (OK)</button>
</div>

<div class="container">
    <!-- सेक्शन 1: चाबी एंट्री -->
    <div id="keySection">
        <h2 style="color:var(--gold)">रहली डिजिटल एसेट</h2>
        <p style="font-size: 13px;">अपनी 5 अंकों की चाबी (Key) दर्ज करें</p>
        <input type="number" id="userKey" placeholder="0 0 0 0 0" oninput="if(this.value.length > 5) this.value = this.value.slice(0, 5);">
        <button class="btn-action" id="unlockBtn" onclick="verifyKey()">अभी अनलॉक करें</button>
    </div>

    <!-- सेक्शन 2: रिवॉर्ड (तिजोरी) -->
    <div id="rewardSection">
        <h2 style="color:#00ff00;">शानदार!</h2>
        <div class="coin-display" id="winAmount">0</div>
        <p style="color:var(--gold); margin-top:-10px;">GOLD COINS</p>
        <img src="https://lh3.googleusercontent.com/d/1rrk784suDVgSiUS8F1GA6HqZgeWia2qT" class="safe-img">
        <button class="btn-action" id="claimBtn" onclick="showMobileInput()" style="background: #27ae60;">वॉलेट में जोड़ें</button>

        <div id="mobileBox">
            <input type="number" id="claimMobile" placeholder="मोबाइल नंबर (10 अंक)" oninput="if(this.value.length > 10) this.value = this.value.slice(0, 10);">
            <button class="btn-action" onclick="finalizeAccount()">पुष्टि करें (Confirm)</button>
        </div>
    </div>
</div>

<audio id="winSound">
    <source src="https://docs.google.com/uc?export=download&id=1IG486iet9kCnOR3aWcV1rSsS6XTyckhX" type="audio/mpeg">
</audio>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAuqo9MoZ9lr4STXztO36n0ASqHOytdAeI",
        authDomain: "rehli-digital-asset.firebaseapp.com",
        projectId: "rehli-digital-asset",
        storageBucket: "rehli-digital-asset.firebasestorage.app",
        messagingSenderId: "779415089179",
        appId: "1:779415089179:web:4f6654088af999ed7ac8be"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let wonCoins = 0;
    let inputKey = "";

    // कस्टम अलर्ट फंक्शन
    window.showAlert = (title, msg, type) => {
        document.getElementById('alertTitle').innerText = title;
        document.getElementById('alertMsg').innerText = msg;
        document.getElementById('alertIcon').innerText = type === 'error' ? '❌' : '⚠️';
        document.getElementById('customAlert').style.display = 'block';
    };

    window.closeAlert = () => { document.getElementById('customAlert').style.display = 'none'; };

    window.verifyKey = async () => {
        inputKey = document.getElementById('userKey').value;
        const btn = document.getElementById('unlockBtn');

        if (inputKey.length !== 5) {
            showAlert("अपूर्ण चाबी", "कृपया 5 अंकों की पूरी चाबी डालें।", "error");
            return;
        }

        btn.disabled = true;

        try {
            const assetRef = doc(db, "assets", inputKey);
            const assetSnap = await getDoc(assetRef);

            if (assetSnap.exists()) {
                wonCoins = assetSnap.data().value || 0;
                // चाबी सही है, अब रिवॉर्ड दिखाएँ
                document.getElementById('keySection').style.display = 'none';
                document.getElementById('rewardSection').style.display = 'block';
                document.getElementById('winAmount').innerText = wonCoins;
                document.getElementById('winSound').play();
            } else {
                showAlert("गलत चाबी", "यह चाबी अमान्य है। कृपया वीडियो फिर से देखें।", "error");
                btn.disabled = false;
            }
        } catch (e) { showAlert("एरर", e.message, "error"); btn.disabled = false; }
    };

    window.showMobileInput = () => {
        document.getElementById('claimBtn').style.display = 'none';
        document.getElementById('mobileBox').style.display = 'block';
    };

    window.finalizeAccount = async () => {
        const mobile = document.getElementById('claimMobile').value;
        if (mobile.length !== 10) {
            showAlert("गलत नंबर", "10 अंकों का मोबाइल नंबर डालें।", "error");
            return;
        }

        try {
            // 1. Check Usage: क्या इस यूजर ने इस महीने यह चाबी इस्तेमाल की है?
            const usageRef = doc(db, "users", mobile, "used_keys", inputKey);
            const usageSnap = await getDoc(usageRef);

            if (usageSnap.exists()) {
                const lastUsed = new Date(usageSnap.data().timestamp);
                const today = new Date();
                const diffDays = Math.ceil((today - lastUsed) / (1000 * 60 * 60 * 24));

                if (diffDays < 30) {
                    showAlert("लिमिट समाप्त", `आप इस चाबी का उपयोग ${30 - diffDays} दिन बाद ही कर पाएंगे।`, "error");
                    return;
                }
            }

            // 2. सब सही है, बैलेंस अपडेट करें और तारीख सेव करें
            const userRef = doc(db, "users", mobile);
            const userSnap = await getDoc(userRef);
            let currentBalance = 0;

            if (userSnap.exists()) {
                currentBalance = userSnap.data().balance || 0;
            }

            // बैलेंस अपडेट
            await setDoc(userRef, { 
                mobile: mobile, 
                balance: currentBalance + wonCoins,
                lastUpdate: new Date().toISOString()
            }, { merge: true });

            // चाबी का रिकॉर्ड सेव करें
            await setDoc(usageRef, {
                timestamp: new Date().toISOString(),
                key: inputKey,
                amount: wonCoins
            });

            showAlert("सफलता! ✅", "सिक्के आपके खाते में जोड़ दिए गए हैं।", "success");
            setTimeout(() => { window.location.href = "profile-setup.html"; }, 2000);

        } catch (e) { showAlert("एरर", "डेटा सेव नहीं हो सका।", "error"); }
    };
</script>
</body>
</html>
